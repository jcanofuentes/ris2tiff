[project]
name = "ris2tiff"
version = "0.1.0"
description = "Converter from RIS (Reversa 3D scanner) to TIFF 32-bit grayscale"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "tifffile",
    "pillow",
]

[project.optional-dependencies]
dev = ["pyinstaller"]

[project.scripts]
ris2tiff = "ris2tiff.converter:main"

[project.gui-scripts]
ris2tiff-gui = "ris2tiff.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
